name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The desktop app's Electron binary isn't needed to test the server and web client.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  test:
    name: Typecheck, build, tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests (signaling, mode policy, SFU with a real mediasoup worker, frame encryption)
        run: npm test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (fake camera + microphone)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            packages/e2e/playwright-report
            packages/e2e/test-results
          retention-days: 14

  server-windows:
    name: Server tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Build server
        run: npm run build -w @tutaj/server

      - name: Server and client unit tests
        run: npm test

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Lint deploy scripts
        run: shellcheck deploy/install.sh deploy/update.sh

      - name: Validate compose file
        run: |
          printf 'DOMAIN=example.com\nPUBLIC_IP=203.0.113.10\nTURN_SECRET=x\nSESSION_SECRET=y\n' > deploy/.env
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.build.yml config --quiet
          rm deploy/.env

      - name: Validate reverse-proxy templates (nginx, Caddy, Apache)
        run: |
          r() { sed 's/__DOMAIN__/rozmowa.example.com/g; s/__PORT__/3000/g' "deploy/proxy/$1"; }
          mkdir -p /tmp/proxy && r nginx.conf > /tmp/proxy/tutaj.conf && r Caddyfile > /tmp/proxy/Caddyfile && r apache.conf > /tmp/proxy/apache.conf
          docker run --rm -v /tmp/proxy/tutaj.conf:/etc/nginx/conf.d/tutaj.conf:ro nginx:1.27-alpine nginx -t
          docker run --rm -v /tmp/proxy/Caddyfile:/etc/caddy/Caddyfile:ro caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -v /tmp/proxy/apache.conf:/tmp/tutaj.conf:ro httpd:2.4 sh -c '
            sed -i -E "s/^#(LoadModule (proxy_module|proxy_http_module|proxy_wstunnel_module|headers_module))/\1/" conf/httpd.conf &&
            echo "Include /tmp/tutaj.conf" >> conf/httpd.conf && httpd -t'

      - name: Build image
        run: docker build -t tutaj:ci .

      - name: Smoke test
        run: |
          docker run -d --name tutaj -p 3000:3000 tutaj:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/ | grep -q '<title>Tutaj</title>'
          # "SFU   <ip>:40000" means the mediasoup worker started (vs. "SFU disabled: ...").
          docker logs tutaj | grep -E 'SFU +[0-9]'
          docker rm -f tutaj
