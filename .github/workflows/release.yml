name: Release (Windows installer)

# Builds Tutaj-Setup-<version>.exe. A pushed tag like v0.1.0 also publishes a GitHub Release with it;
# a manual run just uploads the installer as a workflow artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run desktop:dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Tutaj-Setup
          path: packages/desktop/release/Tutaj-Setup-*.exe
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/desktop/release/Tutaj-Setup-*.exe \
            --title "Tutaj $GITHUB_REF_NAME" --generate-notes
