# Production setup on a VPS with a public IPv4 and a domain:
#   Tutaj (signaling + web client + SFU) behind Caddy (automatic HTTPS) + coturn (TURN relay).
#
#   sudo ./install.sh <domain>   # Docker, ports, firewall rules, .env, start (see README.md)
#   sudo ./update.sh             # newest version: deploy files (git) + image (GHCR), restart
#
# The image comes ready-made from GHCR (amd64 + arm64). TUTAJ_VERSION in .env pins a release
# (e.g. 0.3 or 0.3.0; default: latest = newest tested master). To build from source on the server
# instead, see docker-compose.build.yml (install.sh with TUTAJ_BUILD=1).
#
# Ports: 3478 (tcp+udp, TURN) · 40000 (tcp+udp, SFU) · 49160-49200 (udp, TURN relay)
#        + 80, 443 (tcp) when the bundled Caddy is used.

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '3' }

services:
  tutaj:
    image: ${TUTAJ_IMAGE:-ghcr.io/kauczu/tutaj}:${TUTAJ_VERSION:-latest}
    restart: unless-stopped
    logging: *logging
    ports:
      # SFU media: a single port for UDP and TCP, announced under the public IP.
      - '40000:40000/udp'
      - '40000:40000/tcp'
      # HTTP for a reverse proxy on this host (bundled Caddy or an existing nginx/Apache) — never public.
      - '127.0.0.1:${TUTAJ_HTTP_PORT:-3000}:3000'
    environment:
      SFU: 1
      SFU_PORT: 40000
      SFU_ANNOUNCED_ADDRESS: ${PUBLIC_IP:?set PUBLIC_IP in .env}
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      TURN_URLS: turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env}
      MAX_PEERS: 4
      # --- Abuse protection (see README) — the owner (OWNER_KEY / TRUSTED_IPS) is never limited.
      TRUST_PROXY: 1 # real client IPs come from the reverse proxy's X-Forwarded-For
      OWNER_KEY: ${OWNER_KEY:-}
      TRUSTED_IPS: ${TRUSTED_IPS:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-} # default: https://${DOMAIN}
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-20}
      MAX_ROOMS_PER_IP: ${MAX_ROOMS_PER_IP:-5}
      JOINS_PER_MINUTE: ${JOINS_PER_MINUTE:-30}
      TURN_TTL: ${TURN_TTL:-14400} # 4 h
      OWNER_TURN_TTL: ${OWNER_TURN_TTL:-86400} # 24 h

  # Only when ports 80/443 are free (COMPOSE_PROFILES=caddy in .env, set by install.sh).
  # On a server that already runs a web server, that server proxies to 127.0.0.1:TUTAJ_HTTP_PORT instead.
  caddy:
    profiles: [caddy]
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging: *logging
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [tutaj]

  coturn:
    image: coturn/coturn:4.7.0
    restart: unless-stopped
    logging: *logging
    # TURN needs real UDP ports; host networking avoids NAT-ing a port range through Docker.
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      - --no-tls
      - --no-dtls
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${PUBLIC_IP}
      - --realm=${DOMAIN}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      - --log-file=stdout
      - --simple-log
      # Bandwidth and allocation limits (bytes/s). Far above what a 4-person call needs per session.
      - --max-bps=${TURN_MAX_BPS:-625000} # per session, each direction (~5 Mbit/s)
      - --bps-capacity=${TURN_BPS_CAPACITY:-0} # whole server; 0 = no cap
      - --user-quota=${TURN_USER_QUOTA:-12} # allocations per credential (one per participant)
      - --total-quota=${TURN_TOTAL_QUOTA:-300}
      # Never relay into this host's loopback or private networks.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255

volumes:
  caddy-data:
  caddy-config:
