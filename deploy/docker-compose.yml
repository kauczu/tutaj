# Production setup on a VPS with a public IP and a domain:
#   Tutaj (signaling + web client) behind Caddy (automatic HTTPS) + coturn (TURN relay).
#
#   cp .env.example .env   # fill in DOMAIN, PUBLIC_IP, TURN_SECRET, SESSION_SECRET
#   docker compose up -d
#
# Open firewall ports: 80, 443 (tcp), 3478 (tcp+udp), 5349 (tcp), 40000 (tcp+udp, SFU), 49160-49200 (udp).

services:
  tutaj:
    build: ..
    restart: unless-stopped
    # SFU media: a single port for UDP and TCP, announced under the public IP.
    ports: ["40000:40000/udp", "40000:40000/tcp"]
    environment:
      SFU: 1
      SFU_PORT: 40000
      SFU_ANNOUNCED_ADDRESS: ${PUBLIC_IP}
      PUBLIC_URL: https://${DOMAIN}
      SESSION_SECRET: ${SESSION_SECRET}
      TURN_URLS: turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp,turns:${DOMAIN}:5349?transport=tcp
      TURN_SECRET: ${TURN_SECRET}
      MAX_PEERS: 4

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  coturn:
    image: coturn/coturn:4.7.0
    restart: unless-stopped
    # TURN needs real UDP ports; host networking avoids NAT-ing a large port range through Docker.
    network_mode: host
    command:
      - -n
      - --listening-port=3478
      - --tls-listening-port=5349
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${PUBLIC_IP}
      - --realm=${DOMAIN}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

volumes:
  caddy-data:
