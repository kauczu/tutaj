# Tutaj — reverse proxy in Apache 2.4.47+ (install.sh fills in __DOMAIN__ and __PORT__).
# Modules: sudo a2enmod proxy proxy_http proxy_wstunnel headers
# HTTPS:   sudo certbot --apache -d __DOMAIN__
<VirtualHost *:80>
    ServerName __DOMAIN__

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    # upgrade=websocket passes the signaling WebSocket through.
    ProxyPass        / http://127.0.0.1:__PORT__/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:__PORT__/
    # Signaling WebSockets stay open for the whole call.
    ProxyTimeout 3600
</VirtualHost>
