# Tutaj — reverse proxy in nginx (install.sh fills in __DOMAIN__ and __PORT__).
# HTTPS: sudo certbot --nginx -d __DOMAIN__  (adds the 443 server block for you)

# WebSocket upgrade; a unique variable name so it can't clash with other sites' maps.
map $http_upgrade $tutaj_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tutaj_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Signaling WebSockets stay open for the whole call.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
