<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#02060c" />
    <meta name="description" content="Tutaj — spójna platforma komunikacyjna: wideorozmowy dla 2–4 osób." />
    <meta name="author" content="Lorem Ipsum" />
    <link rel="preload" href="/background.webp" as="image" type="image/webp" media="(min-width: 701px)" />
    <link rel="preload" href="/background-mobile.webp" as="image" type="image/webp" media="(max-width: 700px)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Tutaj</title>
  </head>
  <body>
    <!-- Lobby -->
    <main id="lobby" class="lobby">
      <section class="lobby-card">
        <header class="brand">
          <img class="brand-icon" src="/icon.svg" alt="" width="52" height="52" />
          <div>
            <h1><img class="brand-logo" src="/logo.webp" alt="Tutaj.eu.org by Lorem Ipsum" width="720" height="512" /></h1>
            <p id="tagline" data-i18n="lobby.tagline">Spójna platforma komunikacyjna.</p>
          </div>
        </header>

        <div class="preview">
          <video id="preview-video" autoplay playsinline muted></video>
          <div id="preview-placeholder" class="preview-placeholder">
            <span id="preview-note"></span>
            <button id="preview-toggle" class="ghost preview-toggle" type="button"></button>
          </div>
          <div class="preview-controls">
            <button id="preview-mic" class="round" type="button" aria-pressed="true" title="Mikrofon" data-i18n-title="lobby.mic"></button>
            <button id="preview-cam" class="round" type="button" aria-pressed="true" title="Kamera" data-i18n-title="lobby.camera"></button>
          </div>
          <div id="preview-meter" class="meter"><span></span></div>
        </div>

        <form id="join-form" class="join-form" autocomplete="on">
          <label><span data-i18n="lobby.name">Twoje imię</span>
            <input id="name" name="name" required maxlength="40" placeholder="np. Ania" data-i18n-placeholder="lobby.namePlaceholder" autocomplete="nickname" />
          </label>
          <label><span data-i18n="lobby.room">Pokój</span>
            <div class="row">
              <input id="room" name="room" required maxlength="64" pattern="[A-Za-z0-9][A-Za-z0-9_\-]*" title="Litery, cyfry, - i _" data-i18n-title="lobby.roomPattern" />
              <button id="random-room" type="button" class="ghost" title="Losowa nazwa" data-i18n-title="lobby.randomRoom">↻</button>
            </div>
          </label>

          <details>
            <summary data-i18n="lobby.advanced">Urządzenia, jakość i ustawienia zaawansowane</summary>
            <label><span data-i18n="lobby.language">Język</span>
              <select id="language">
                <option value="auto" data-i18n="lobby.languageAuto">Automatycznie</option>
                <option value="pl">Polski</option>
                <option value="en">English</option>
              </select>
            </label>
            <label><span data-i18n="lobby.mic">Mikrofon</span> <select id="audio-input"></select></label>
            <label><span data-i18n="lobby.camera">Kamera</span> <select id="video-input"></select></label>
            <fieldset id="quality-lobby" class="quality"></fieldset>
            <label><span data-i18n="lobby.password">Hasło pokoju (opcjonalnie)</span>
              <input id="password" type="password" maxlength="128" autocomplete="off" placeholder="ustala je pierwsza osoba w pokoju" data-i18n-placeholder="lobby.passwordPlaceholder" />
            </label>
            <label><span data-i18n="lobby.server">Serwer sygnalizacji</span>
              <input id="server" maxlength="200" placeholder="domyślnie: ten sam co strona (np. 192.168.1.5:3000)" data-i18n-placeholder="lobby.serverPlaceholder" />
            </label>
            <label><span data-i18n="lobby.ownerKey">Klucz właściciela serwera (opcjonalnie)</span>
              <input id="owner-key" type="password" maxlength="256" autocomplete="off" placeholder="zdejmuje limity — tylko dla właściciela" data-i18n-placeholder="lobby.ownerKeyPlaceholder" />
            </label>
          </details>

          <details id="host-details" class="host-details" hidden>
            <summary id="host-summary" data-i18n="desk.network">Serwer i sieć</summary>
            <div id="host-info" class="host-info"></div>
          </details>
          <p id="lobby-error" class="error" role="alert" hidden></p>
          <button id="join" class="primary" type="submit" data-i18n="lobby.join">Dołącz</button>
        </form>
      </section>
      <footer id="lobby-footer" class="lobby-footer"></footer>
    </main>

    <!-- Room -->
    <main id="room-view" class="room" hidden>
      <div class="stage">
        <div id="grid" class="grid"></div>
        <div id="reconnecting" class="banner" role="status" hidden></div>
      </div>

      <div id="reaction-picker" class="reaction-picker" role="menu" hidden></div>
      <div id="tile-menu" class="tile-menu" role="menu" hidden></div>
      <div id="more-menu" class="tile-menu" role="menu" hidden></div>

      <aside id="chat" class="chat" hidden>
        <header>
          <h2 data-i18n="chat.title">Czat</h2>
          <button id="chat-close" class="ghost" type="button" title="Zamknij" data-i18n-title="chat.close">✕</button>
        </header>
        <ol id="chat-list" class="chat-list" aria-live="polite"></ol>
        <form id="chat-form" class="chat-form">
          <button id="chat-file" class="ghost" type="button" title="Wyślij plik" data-i18n-title="chat.file"></button>
          <input id="chat-file-input" type="file" multiple hidden />
          <input id="chat-input" maxlength="2000" placeholder="Napisz wiadomość…" data-i18n-placeholder="chat.placeholder" autocomplete="off" />
          <button class="primary" type="submit" data-i18n="chat.send">Wyślij</button>
        </form>
      </aside>

      <footer class="controls">
        <div class="room-info">
          <span id="room-name"></span>
          <span id="mode-badge" class="mode-badge mesh">P2P</span>
          <span id="e2ee-badge" class="mode-badge e2ee" hidden>E2EE</span>
          <span id="encoder-badge" class="mode-badge" hidden></span>
          <span id="locked-badge" class="mode-badge locked" title="Pokój zablokowany przez gospodarza — nowe osoby nie dołączą" data-i18n-title="mod.lockedBadge" hidden>🔒</span>
          <span id="timer">00:00</span>
        </div>
        <div class="buttons">
          <button id="btn-mic" class="round" type="button" title="Mikrofon (M)" data-i18n-title="ctl.mic"></button>
          <button id="btn-cam" class="round" type="button" title="Kamera (V)" data-i18n-title="ctl.cam"></button>
          <button id="btn-screen" class="round secondary" type="button" title="Udostępnij ekran (S)" data-i18n-title="ctl.screen"></button>
          <button id="btn-hand" class="round secondary" type="button" title="Podnieś rękę (H)" data-i18n-title="ctl.hand"></button>
          <button id="btn-react" class="round" type="button" title="Reakcja (R, potem 1–6)" data-i18n-title="ctl.react" aria-haspopup="true" aria-expanded="false"></button>
          <button id="btn-chat" class="round" type="button" title="Czat (C)" data-i18n-title="ctl.chat"><span id="chat-badge" class="badge" hidden></span></button>
          <button id="btn-overlay" class="round secondary" type="button" title="Nakładka na grę" data-i18n-title="ctl.overlay" hidden></button>
          <button id="btn-pip" class="round secondary" type="button" title="Obraz w obrazie (P)" data-i18n-title="ctl.pip" hidden></button>
          <button id="btn-record" class="round secondary" type="button" title="Nagrywaj lokalnie" data-i18n-title="ctl.record"></button>
          <button id="btn-settings" class="round secondary" type="button" title="Ustawienia" data-i18n-title="ctl.settings"></button>
          <button id="btn-more" class="round" type="button" title="Więcej" data-i18n-title="ctl.more" aria-haspopup="true"></button>
          <button id="btn-leave" class="round danger" type="button" title="Opuść" data-i18n-title="ctl.leave"></button>
        </div>
        <div class="room-actions">
          <button id="btn-invite" class="ghost" type="button" data-i18n="ctl.invite">Kopiuj zaproszenie</button>
        </div>
      </footer>

      <dialog id="settings" class="settings-dialog">
        <form method="dialog" class="settings-form">
          <div class="dialog-head">
            <h2 data-i18n="set.title">Ustawienia</h2>
            <button id="open-help" class="ghost" type="button" title="Skrócona instrukcja obsługi (F1)" data-i18n-title="set.helpTitle" data-i18n="set.help">Pomoc</button>
          </div>
          <div class="settings-body">
            <nav class="settings-nav" role="tablist" aria-orientation="vertical" aria-label="Sekcje ustawień" data-i18n-aria-label="set.sections">
              <button id="tab-devices" class="settings-tab" type="button" role="tab" data-tab="devices" data-icon="mic" aria-controls="panel-devices"><span data-i18n="tab.devices">Urządzenia</span></button>
              <button id="tab-quality" class="settings-tab" type="button" role="tab" data-tab="quality" data-icon="sliders" aria-controls="panel-quality"><span data-i18n="tab.quality">Jakość</span></button>
              <button id="tab-connection" class="settings-tab" type="button" role="tab" data-tab="connection" data-icon="network" aria-controls="panel-connection"><span data-i18n="tab.connection">Połączenie</span></button>
              <button id="tab-room" class="settings-tab" type="button" role="tab" data-tab="room" data-icon="people" aria-controls="panel-room"><span data-i18n="tab.room">Pokój</span></button>
              <button id="tab-overlay" class="settings-tab" type="button" role="tab" data-tab="overlay" data-icon="overlay" aria-controls="panel-overlay" hidden><span data-i18n="tab.overlay">Nakładka i skróty</span></button>
              <button id="tab-about" class="settings-tab" type="button" role="tab" data-tab="about" data-icon="info" aria-controls="panel-about"><span data-i18n="tab.about">O aplikacji</span></button>
            </nav>
            <div class="settings-panels">
            <section id="panel-devices" class="settings-panel" role="tabpanel" aria-labelledby="tab-devices" hidden>
              <h3 data-i18n="tab.devices">Urządzenia</h3>
              <label><span data-i18n="set.mic">Mikrofon</span> <select id="set-audio-input"></select></label>
              <label><span data-i18n="set.camera">Kamera</span> <select id="set-video-input"></select></label>
              <label id="set-audio-output-wrap"><span data-i18n="set.speaker">Głośnik</span> <select id="set-audio-output"></select></label>
            </section>
            <section id="panel-quality" class="settings-panel" role="tabpanel" aria-labelledby="tab-quality" hidden>
              <h3 data-i18n="tab.quality">Jakość</h3>
              <fieldset id="quality-room" class="quality"></fieldset>
            </section>
            <section id="panel-connection" class="settings-panel" role="tabpanel" aria-labelledby="tab-connection" hidden>
              <h3 data-i18n="tab.connection">Połączenie</h3>
              <label><span data-i18n="set.mode">Tryb mediów</span>
                <select id="set-mode">
                  <option value="auto" data-i18n="set.modeAuto">Automatyczny</option>
                  <option value="mesh" data-i18n="set.modeMesh">P2P (bezpośrednio)</option>
                  <option value="sfu" data-i18n="set.modeSfu">SFU (przez serwer)</option>
                </select>
              </label>
              <p id="mode-info" class="muted small"></p>
              <p id="send-stats" class="send-stats small" hidden></p>
              <div id="peer-stats" class="peer-stats"></div>
            </section>
            <section id="panel-room" class="settings-panel" role="tabpanel" aria-labelledby="tab-room" hidden>
              <h3 data-i18n="tab.room">Pokój</h3>
              <fieldset id="host-settings" class="quality"></fieldset>
            </section>
            <section id="panel-overlay" class="settings-panel" role="tabpanel" aria-labelledby="tab-overlay" hidden>
              <h3 data-i18n="tab.overlay">Nakładka i skróty</h3>
              <fieldset id="overlay-settings" class="quality" hidden></fieldset>
            </section>
            <section id="panel-about" class="settings-panel" role="tabpanel" aria-labelledby="tab-about" hidden>
              <h3 data-i18n="tab.about">O aplikacji</h3>
              <section id="about" class="about" aria-label="O aplikacji" data-i18n-aria-label="about.label"></section>
            </section>
            </div>
          </div>
          <div class="dialog-foot">
            <button class="primary" value="close" data-i18n="set.close">Zamknij</button>
          </div>
        </form>
      </dialog>
    </main>

    <dialog id="help" class="help-dialog" aria-labelledby="help-title">
      <form method="dialog" class="help">
        <h2 id="help-title" data-i18n="help.title">Pomoc — jak używać Tutaj</h2>
        <div id="help-body" class="help-body"></div>
        <button class="primary" value="close" data-i18n="set.close">Zamknij</button>
      </form>
    </dialog>

    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
