<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Tutaj — brak połączenia</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, 'Segoe UI', sans-serif; }
      html, body { margin: 0; height: 100%; color: #e8f1fa; }
      body {
        display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        background: radial-gradient(140% 90% at 30% 110%, #295887 0%, #002050 30%, #02060c 62%), #02060c;
      }
      .card {
        width: min(440px, 100%); padding: 28px; border-radius: 24px; display: grid; gap: 16px;
        background: rgba(6, 16, 38, 0.6); border: 1px solid rgba(108, 158, 202, 0.2);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      }
      h1 { margin: 0; font-size: 28px; font-weight: 300; letter-spacing: 0.04em; }
      p { margin: 0; color: #93aec9; line-height: 1.5; }
      .reason { font-size: 13px; opacity: 0.8; }
      button {
        font: inherit; cursor: pointer; border-radius: 12px; padding: 12px 18px; color: #fff; border: 0;
      }
      .primary { background: linear-gradient(135deg, #63b6e6 0%, #3a82bd 55%, #295887 100%); font-weight: 650; }
      .ghost { background: rgba(16, 31, 72, 0.5); border: 1px solid rgba(108, 158, 202, 0.25); }
      .row { display: grid; gap: 10px; }
      .logo { width: 200px; justify-self: center; opacity: 0.9; filter: drop-shadow(0 0 6px rgba(127, 200, 255, 0.22)); }
      input {
        font: inherit; color: #e8f1fa; background: rgba(2, 8, 22, 0.55); border: 1px solid rgba(108, 158, 202, 0.25);
        border-radius: 12px; padding: 10px 12px;
      }
      details { color: #93aec9; font-size: 14px; }
      details[open] { display: grid; gap: 8px; }
      summary { cursor: pointer; }
      .error { color: #ff9a9d; font-size: 13px; }
      .hint { font-size: 12.5px; }
      button:disabled { opacity: 0.6; cursor: default; }
      footer { text-align: center; font-size: 12px; color: #93aec9; }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="logo.webp" alt="Tutaj.eu.org by Lorem Ipsum" />
      <h1 id="title">Brak połączenia</h1>
      <p id="message"></p>
      <p class="reason" id="reason"></p>
      <div class="row">
        <button class="primary" id="retry">Spróbuj ponownie</button>
        <button class="ghost" id="reset" hidden></button>
        <button class="ghost" id="lan">Uruchom tryb lokalny (sieć LAN, bez internetu)</button>
      </div>
      <details id="change">
        <summary id="change-summary">Zmień serwer</summary>
        <input id="server-url" type="text" placeholder="np. twoja-domena.pl" aria-label="Adres serwera Tutaj" />
        <button class="ghost" id="save-server">Sprawdź i zapisz</button>
        <p class="hint" id="hint">Adres zostanie zapisany tylko wtedy, gdy działa pod nim serwer Tutaj.</p>
        <p class="error" id="server-error" hidden></p>
      </details>
      <footer id="footer">© 2026 Lorem Ipsum · tutaj.eu.org · menu aplikacji: klawisz Alt</footer>
    </main>
    <script>
      const q = new URLSearchParams(location.search);
      const $ = (id) => document.getElementById(id);
      const en = q.get('lang') === 'en';
      const T = en
        ? {
            pageTitle: 'Tutaj — no connection', noConn: 'No connection', retry: 'Try again', lan: 'Start local mode (LAN, no internet)',
            change: 'Change server', placeholder: 'e.g. your-domain.com', address: 'Tutaj server address', save: 'Check and save',
            hint: 'The address is saved only if a Tutaj server answers there.', footer: '© 2026 Lorem Ipsum · tutaj.eu.org · app menu: Alt key',
            foreignTitle: 'This is not a Tutaj server', foreign1: 'No Tutaj server runs at ', foreign2: ', so the app did not open it. Choose another server or restore the default one.',
            checkAgain: 'Check again', chooseTitle: 'Tutaj server', lanRunning: 'The app runs in local mode.', current: 'Current server: ',
            backToCall: 'Back to the call', backTo: 'Back to {host}', cannot1: 'Cannot connect to the server ', cannot2: '. Check your internet connection and try again.',
            details: 'Details: ', restore: 'Restore {host}', checking: 'Checking the server…',
          }
        : {
            pageTitle: 'Tutaj — brak połączenia', noConn: 'Brak połączenia', retry: 'Spróbuj ponownie', lan: 'Uruchom tryb lokalny (sieć LAN, bez internetu)',
            change: 'Zmień serwer', placeholder: 'np. twoja-domena.pl', address: 'Adres serwera Tutaj', save: 'Sprawdź i zapisz',
            hint: 'Adres zostanie zapisany tylko wtedy, gdy działa pod nim serwer Tutaj.', footer: '© 2026 Lorem Ipsum · tutaj.eu.org · menu aplikacji: klawisz Alt',
            foreignTitle: 'To nie jest serwer Tutaj', foreign1: 'Pod adresem ', foreign2: ' nie działa serwer Tutaj, więc aplikacja go nie otworzyła. Wybierz inny serwer albo przywróć domyślny.',
            checkAgain: 'Sprawdź ponownie', chooseTitle: 'Serwer Tutaj', lanRunning: 'Aplikacja działa w trybie lokalnym.', current: 'Bieżący serwer: ',
            backToCall: 'Wróć do rozmowy', backTo: 'Wróć do {host}', cannot1: 'Nie mogę połączyć się z serwerem ', cannot2: '. Sprawdź internet i spróbuj ponownie.',
            details: 'Szczegóły: ', restore: 'Przywróć {host}', checking: 'Sprawdzam serwer…',
          };
      document.documentElement.lang = en ? 'en' : 'pl';
      document.title = T.pageTitle;
      $('title').textContent = T.noConn;
      $('retry').textContent = T.retry;
      $('lan').textContent = T.lan;
      $('change-summary').textContent = T.change;
      $('server-url').placeholder = T.placeholder;
      $('server-url').setAttribute('aria-label', T.address);
      $('save-server').textContent = T.save;
      $('hint').textContent = T.hint;
      $('footer').textContent = T.footer;
      const kind = q.get('kind') || 'unreachable';
      const server = q.get('server') || '';
      const def = q.get('default') || '';
      const host = (u) => { try { return new URL(u).host; } catch { return u; } };
      const say = (el, text) => { el.textContent = ''; el.append(...text); };
      const strong = (t) => Object.assign(document.createElement('strong'), { textContent: t });

      if (kind === 'foreign') {
        $('title').textContent = T.foreignTitle;
        say($('message'), [T.foreign1, strong(host(server)), T.foreign2]);
        $('retry').textContent = T.checkAgain;
        $('change').open = true;
      } else if (kind === 'choose') {
        $('title').textContent = T.chooseTitle;
        say($('message'), [q.get('mode') === 'lan' ? T.lanRunning : T.current, ...(q.get('mode') === 'lan' ? [] : [strong(host(server))])]);
        $('retry').textContent = q.get('mode') === 'lan' ? T.backToCall : T.backTo.replace('{host}', host(server));
        $('change').open = true;
      } else {
        say($('message'), [T.cannot1, strong(host(server) || 'Tutaj'), T.cannot2]);
        // Retry on its own when the connection comes back.
        window.addEventListener('online', () => window.tutaj.retry());
      }
      $('reason').textContent = q.get('reason') ? T.details + q.get('reason') : '';
      if (def && host(def) !== host(server)) {
        $('reset').hidden = false;
        $('reset').textContent = T.restore.replace('{host}', host(def));
        $('reset').onclick = () => window.tutaj.setServer('');
      }
      $('retry').onclick = () => window.tutaj.retry();
      $('lan').onclick = () => window.tutaj.switchMode('lan');

      const urlInput = $('server-url');
      urlInput.value = kind === 'foreign' ? '' : server;
      const save = async () => {
        const btn = $('save-server');
        const err = $('server-error');
        btn.disabled = true;
        btn.textContent = T.checking;
        err.hidden = true;
        const res = await window.tutaj.setServer(urlInput.value);
        if (res && !res.ok) {
          err.textContent = res.error;
          err.hidden = false;
          btn.disabled = false;
          btn.textContent = T.save;
        }
      };
      $('save-server').onclick = save;
      urlInput.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); save(); } };
      // Retry on its own when the connection comes back.
      window.addEventListener('online', () => window.tutaj.retry());
    </script>
  </body>
</html>
