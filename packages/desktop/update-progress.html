<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Aktualizacja Tutaj</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, 'Segoe UI', sans-serif; }
      html, body { margin: 0; height: 100%; color: #e8f1fa; user-select: none; }
      body {
        display: grid; align-content: center; gap: 14px; padding: 22px 24px; box-sizing: border-box;
        background: radial-gradient(140% 120% at 20% 120%, #295887 0%, #002050 35%, #02060c 70%), #02060c;
      }
      h1 { margin: 0; font-size: 17px; font-weight: 600; }
      .bar { height: 10px; border-radius: 6px; overflow: hidden; background: rgba(16, 31, 72, 0.8); border: 1px solid rgba(108, 158, 202, 0.25); }
      .fill { height: 100%; width: 0%; border-radius: 6px; transition: width 0.25s;
        background: linear-gradient(90deg, #63b6e6 0%, #3a82bd 60%, #4fd1a5 100%); }
      .bar.busy .fill { width: 35% !important; animation: slide 1.2s ease-in-out infinite alternate; }
      @keyframes slide { from { margin-left: 0; } to { margin-left: 65%; } }
      .info { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: #93aec9; font-variant-numeric: tabular-nums; }
      .info strong { color: #e8f1fa; font-weight: 600; }
      .buttons { display: flex; justify-content: flex-end; gap: 10px; }
      button { font: inherit; font-size: 13px; cursor: pointer; border-radius: 10px; padding: 7px 16px; color: #e8f1fa;
        background: rgba(16, 31, 72, 0.6); border: 1px solid rgba(108, 158, 202, 0.3); }
      button:hover { background: rgba(41, 88, 135, 0.7); }
      [hidden] { display: none !important; }
      .error { color: #ff9a9d; }
    </style>
  </head>
  <body>
    <h1 id="title">Pobieranie aktualizacji…</h1>
    <div id="bar" class="bar busy"><div id="fill" class="fill"></div></div>
    <div class="info"><span id="left"><strong>0%</strong></span><span id="right"></span></div>
    <div class="buttons">
      <button id="hide" type="button" title="Pobieranie trwa dalej w tle (postęp na ikonie na pasku zadań)">Ukryj</button>
      <button id="cancel" type="button">Anuluj</button>
    </div>
    <script>
      const en = new URLSearchParams(location.search).get('lang') === 'en';
      const T = en
        ? {
            title: 'Tutaj update', downloading: 'Downloading the Tutaj {v} update…', connecting: 'Connecting…', of: 'of',
            installing: 'Installing Tutaj {v}…', restart: 'The app restarts in a moment.', downloaded: 'Tutaj {v} downloaded',
            onQuit: 'It installs when the app closes.', failed: 'Could not download the update', error: 'Download error',
            hide: 'Hide', hideTitle: 'The download goes on in the background (progress on the taskbar icon)', cancel: 'Cancel', close: 'Close',
          }
        : {
            title: 'Aktualizacja Tutaj', downloading: 'Pobieranie aktualizacji Tutaj {v}…', connecting: 'Łączenie…', of: 'z',
            installing: 'Instalowanie Tutaj {v}…', restart: 'Aplikacja za chwilę uruchomi się ponownie.', downloaded: 'Tutaj {v} pobrany',
            onQuit: 'Zainstaluje się po zamknięciu aplikacji.', failed: 'Nie udało się pobrać aktualizacji', error: 'Błąd pobierania',
            hide: 'Ukryj', hideTitle: 'Pobieranie trwa dalej w tle (postęp na ikonie na pasku zadań)', cancel: 'Anuluj', close: 'Zamknij',
          };
      document.documentElement.lang = en ? 'en' : 'pl';
      document.title = T.title;
      const $ = (id) => document.getElementById(id);
      $('hide').textContent = T.hide;
      $('hide').title = T.hideTitle;
      $('cancel').textContent = T.cancel;
      const mb = (b) => (b / 1048576).toLocaleString(en ? 'en-GB' : 'pl-PL', { maximumFractionDigits: 1 });
      $('hide').onclick = () => window.updater.hide();
      $('cancel').onclick = () => window.updater.cancel();
      /** State from the main process: downloading / installing / ready / error. */
      window.updater.onState((s) => {
        const bar = $('bar');
        if (s.state === 'downloading') {
          $('title').textContent = T.downloading.replace('{v}', s.version);
          const known = s.total > 0;
          bar.classList.toggle('busy', !known);
          $('fill').style.width = `${Math.round(s.percent)}%`;
          $('left').innerHTML = known ? `<strong>${Math.floor(s.percent)}%</strong> · ${mb(s.transferred)} ${T.of} ${mb(s.total)} MB` : T.connecting;
          $('right').textContent = s.bytesPerSecond ? `${mb(s.bytesPerSecond)} MB/s` : '';
        } else if (s.state === 'installing') {
          $('title').textContent = T.installing.replace('{v}', s.version);
          bar.classList.add('busy');
          $('left').textContent = T.restart;
          $('right').textContent = '';
          $('hide').hidden = $('cancel').hidden = true;
        } else if (s.state === 'ready') {
          $('title').textContent = T.downloaded.replace('{v}', s.version);
          bar.classList.remove('busy');
          $('fill').style.width = '100%';
          $('left').textContent = T.onQuit;
          $('right').textContent = '';
          $('cancel').hidden = true;
          $('hide').textContent = 'OK';
        } else if (s.state === 'error') {
          $('title').textContent = T.failed;
          bar.classList.remove('busy');
          $('left').innerHTML = '';
          $('left').append(Object.assign(document.createElement('span'), { className: 'error', textContent: s.message || T.error }));
          $('right').textContent = '';
          $('cancel').hidden = true;
          $('hide').textContent = T.close;
        }
      });
    </script>
  </body>
</html>
